[plugin_settings."noctalia/notes"]
panel_position = "center"

[plugin_settings."yuuto/calculator"]
angle_unit = "deg"
panel_placement = "floating"
panel_position = "center"
precision = 5

[plugins]
enabled = [ "yuuto/calculator", "noctalia/notes", "tmelik/system-monitor", "noctalia/timer" ]

[shell]
clipboard_history_max_entries = 20
font_family = "Quicksand"

    [shell.animation]
    speed = 1.6000000238418579

    [shell.launcher]
    search_position = "top"
    show_session_button = false
    show_settings_button = false

[theme]
community_palette = "Catppuccin Macchiato Rosewater"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-fruit-salad"

[wallpaper]
directory = "/home/fayez/Pictures/wallpapers"

    [wallpaper.default]
    path = "/home/fayez/Pictures/wallpapers/wal03.jpg"

    [wallpaper.last]
    path = "/home/fayez/Pictures/wallpapers/wal03.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/fayez/Pictures/wallpapers/wal03.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/fayez/Pictures/wallpapers/wal03.jpg"

[widget.audio_visualizer]
color_2 = "secondary"

[widget.bar]
show_idle_on_horizontal = false
type = "noctalia/timer:bar"

[widget.brightness]
show_when_unavailable = true

[widget.notes]
type = "noctalia/notes:notes"

[widget.summary]
ram_display_mode = "used"
show_download = false
show_gpu_usage = "off"
show_swap = false
show_upload = false
type = "tmelik/system-monitor:summary"

[widget.tray]
drawer = true
