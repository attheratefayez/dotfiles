[ros_kilted_dev]
image=osrf/ros:kilted-desktop-full
nvidia=true
additional_packages="git fzf zoxide curl ca-certificates fuse3 tmux"

init_hooks=curl -LO https://github.com/neovim/neovim/releases/latest/download/nvim-linux-x86_64.tar.gz
init_hooks=tar -xzf nvim-linux-x86_64.tar.gz
init_hooks=mv nvim-linux-x86_64 /opt/nvim
init_hooks=ln -sf /opt/nvim/bin/nvim /usr/local/bin/nvim
init_hooks=git clone --depth 1 https://github.com/junegunn/fzf.git /opt/fzf
init_hooks=/opt/fzf/install --all
