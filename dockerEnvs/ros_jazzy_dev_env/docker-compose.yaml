services:
  ros_jazzy_dev_env:
    build: 
      context: .
      dockerfile: Dockerfile
      args: 
        UID: 1000
        USER: ubuntu
    image: ros_jazzy_dev_env
    container_name: ros_jazzy_dev_env_cont
    network_mode: host
    user: ubuntu
    environment:
      - DISPLAY=${DISPLAY}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY}
    volumes:
      - ${HOME}/Bugs/rosjects/:/home/ubuntu/Bugs/rosjects/:rw
      - /dev:/dev
      - ${XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY}:/${XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY}
      # - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /usr/share/fonts/:/usr/share/fonts/
    tty: true
    command: "/bin/bash"
    runtime: nvidia
